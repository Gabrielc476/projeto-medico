services:
  diagnostic-engine:
    build:
      context: ./diagnostic-engine
      dockerfile: Dockerfile
    container_name: diagnostic-engine
    ports:
      - "50051:50051"
    environment:
      - PYTHONPATH=.
    env_file:
      - ./diagnostic-engine/.env
    volumes:
      - ./diagnostic-engine:/app
      - ./shared/proto:/shared/proto
    # Hot Reload: Monitora mudanças em .py e .json e reinicia o servidor
    command: >
      sh -c "pip install -e '.[dev]' &&
      python scripts/compile_proto.py && 
      watchmedo auto-restart 
      --directory=./src 
      --directory=./data 
      --pattern='*.py;*.json' 
      --recursive 
      -- python -m src.main"
    networks:
      - medical-network

  backend-gateway:
    build:
      context: ./backend-gateway
      dockerfile: Dockerfile
    container_name: backend-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CI=true
      - DIAGNOSTIC_ENGINE_URL=diagnostic-engine:50051
      - DATABASE_URL=postgresql://admin:medical123@postgres-medical:5432/medical_ehr?schema=public
    volumes:
      - ./backend-gateway:/app
      - ./shared:/app/shared
      - /app/node_modules
    command: >
      sh -c "pnpm install && 
             npx prisma generate && 
             pnpm start:dev"
    depends_on:
      - diagnostic-engine
      - postgres
    networks:
      - medical-network

  neo4j:
    image: neo4j:latest
    container_name: neo4j-medical
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/medical123 # Definição de senha inicial
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - medical-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres-medical
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=medical123
      - POSTGRES_DB=medical_ehr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medical-network

networks:
  medical-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
